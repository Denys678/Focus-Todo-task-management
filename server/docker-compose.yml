services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-list-postgres
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d postgres_todo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: